<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Verification - KokoX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d1b69 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .verify-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            padding: 40px;
        }
        .warning-icon {
            font-size: 4rem;
            color: #dc3545;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="verify-card">
        <div class="text-center">
            <div class="warning-icon">⚠️</div>
            <h2 class="mb-3">Adult Content Warning</h2>
            <p class="mb-4">This website contains adult content intended for individuals 18 years of age or older.</p>
            
            <div class="alert alert-danger">
                <strong>You must be 18+ to enter this site.</strong>
            </div>
            
            <div class="d-grid gap-2">
                <button onclick="verifyAge()" class="btn btn-success btn-lg">
                    <i class="fas fa-check"></i> I am 18 or older
                </button>
                <button onclick="leaveSite()" class="btn btn-danger btn-lg">
                    <i class="fas fa-times"></i> I am under 18
                </button>
            </div>
            
            <p class="text-muted small mt-3">
                By entering, you agree to our <a href="/terms">Terms of Service</a> and <a href="/privacy">Privacy Policy</a>
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function verifyAge() {
            // Set cookie for 1 year
            document.cookie = "age_verified=true; path=/; max-age=31536000; SameSite=Lax";
            window.location.href = "/";
        }
        
        function leaveSite() {
            window.location.href = "https://www.google.com";
        }
        
        // Check if already verified
        function checkVerification() {
            const cookies = document.cookie.split(';');
            for (let cookie of cookies) {
                const [name, value] = cookie.trim().split('=');
                if (name === 'age_verified' && value === 'true') {
                    window.location.href = "/";
                    return;
                }
            }
        }
        
        // Run check on page load
        checkVerification();
    </script>
</body>
</html>
